name: CI et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Le contrôle qualité passe avant tout : on ne publie jamais une version qui le rate.
  qualite:
    runs-on: ubuntu-latest
    # Un émulateur bloqué ne doit pas tourner six heures.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci : installe exactement le lockfile, et refuse s'il ne correspond plus à package.json.
      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Typage (vue-tsc)
        run: npm run typecheck

      - name: Tests du moteur et des composants
        run: npm run test

      # Sans les clés, le site se construit branché sur l'émulateur : de quoi vérifier
      # avant le merge que le build passe, pas de quoi publier.
      - name: Build
        run: npm run build

      # L'émulateur Firestore est une application Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Les binaires de l'émulateur (~60 Mo), sinon retéléchargés à chaque run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-firebase-${{ hashFiles('package-lock.json') }}

      - name: Tests sur émulateur (règles, parcours, concurrence)
        run: npm run test:rules

  deploiement:
    needs: qualite
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Sans les clés, l'app se croirait en local et chercherait l'émulateur :
      # le site partirait en ligne, mais rien n'y fonctionnerait. On arrête plutôt.
      - name: Vérification des clés Firebase
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Les règles Firestore partent avant le site : un code qui s'appuie sur de nouvelles
      # règles ne doit jamais être en ligne avant elles. Clé d'un compte de service limité
      # aux règles (secret FIREBASE_SERVICE_ACCOUNT), écrite le temps de la commande seulement.
      - name: Règles Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT manquant"; exit 1; fi
          cle="$RUNNER_TEMP/compte-service.json"
          trap 'rm -f "$cle"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$cle"
          GOOGLE_APPLICATION_CREDENTIALS="$cle" npx firebase deploy --only firestore:rules --project prod --non-interactive

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
